# OPCIONAL: solo si instalas Docker. Sin Docker, sigue el README (python directo).
services:
  helpdesk:
    build: .
    environment:
      MGM_MODE: ${MGM_MODE:-insecure}      # cambia a "secure" para la version defendida
      MGM_LOG_DIR: /data/logs
    ports: ["5000:5000"]
    volumes: [logs:/data/logs]
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  monitor:
    build: .
    command: python monitor/monitor.py --log-dir /data/logs --canary-dir /data/canary
    volumes: [logs:/data/logs, canary:/data/canary]
    networks: [backend]                     # red interna, sin acceso externo
    cap_drop: [ALL]
  attacker:                                  # Kali, solo para pruebas contra TU lab
    image: kalilinux/kali-rolling
    profiles: [attacker]
    command: sleep infinity
    networks: [frontend]
volumes: {logs: {}, canary: {}}
networks:
  frontend: {}
  backend: {internal: true}
